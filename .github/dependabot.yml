version: 2
updates:
  # Root workspace (npm workspaces: apps/api, apps/web).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: npm
    directory: '/apps/api'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: '/apps/web'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep the CI base images patched.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: '/apps/api'
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: '/apps/web'
    schedule:
      interval: weekly
