version: 2
updates:
  # Root workspace (npm workspaces: apps/api, apps/web). This single entry
  # already covers every workspace package, so there are deliberately no
  # separate `/apps/*` npm entries — those produced duplicate PRs for the same
  # dependency (e.g. zod renamed under both root and apps/web).
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  # Keep the CI base images patched.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  # Base-image updates (node:*-alpine) for the api/web Dockerfiles. Major Node
  # bumps are ignored on purpose: odd majors (25, 27, ...) are non-LTS and
  # breaking, while the project pins the LTS line via package.json `engines`
  # (>=24). Minor/patch base updates still come through.
  - package-ecosystem: docker
    directory: '/apps/api'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']

  - package-ecosystem: docker
    directory: '/apps/web'
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
