name: Build, Push to GHCR and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # github.repository is already lowercase (e.g. uniguilanmasterforutanmohammad-ux/alooshomal.ir)
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  # Object storage. MinIO withdrew its official images in 2025 (`minio/minio`
  # was deleted from Docker Hub, dl.min.io returns 410 and the repo is
  # archived), so we mirror the community fork `pgsty/silo` into GHCR. It is a
  # drop-in replacement: same S3 API, same `MINIO_*` env vars, same `mc ready
  # local` healthcheck. Pin the immutable `RELEASE.*` tag, never `latest`.
  MINIO_SOURCE: docker.io/pgsty/silo
  MINIO_TAG: RELEASE.2026-09-16T00-00-00Z

jobs:
  build-and-push:
    name: Build & push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./apps/api
          - name: web
            context: ./apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* are baked into the web bundle at build time.
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  mirror-minio:
    name: Mirror object-storage image to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Copy the manifest straight between registries (no layer download on the
      # runner) so the mirrored image keeps every published architecture.
      - name: Mirror ${{ env.MINIO_SOURCE }} to ${{ env.IMAGE_PREFIX }}-minio
        run: |
          set -e
          docker buildx imagetools create \
            --tag "${IMAGE_PREFIX}-minio:${MINIO_TAG}" \
            --tag "${IMAGE_PREFIX}-minio:latest" \
            "${MINIO_SOURCE}:${MINIO_TAG}"

      # A freshly pushed package defaults to private even on a public repo; the
      # server pulls it anonymously, so make it public. Best-effort: if the
      # token cannot change visibility, the deploy step's GHCR_PAT login covers it.
      - name: Make the mirrored package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          pkg="${GITHUB_REPOSITORY#*/}-minio"
          for scope in "/user" "/users/${GITHUB_REPOSITORY%%/*}" "/orgs/${GITHUB_REPOSITORY%%/*}"; do
            code=$(curl -sS -X PATCH \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com${scope}/packages/container/${pkg}" \
              -d '{"visibility":"public"}' -o /dev/null -w '%{http_code}')
            echo "PATCH ${scope}/packages/container/${pkg} -> ${code}"
            [ "${code}" = "200" ] && break
          done

  deploy:
    name: Deploy to server
    needs: [build-and-push, mirror-minio]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.prod.yml,deploy/nginx"
          target: ${{ vars.DEPLOY_PATH || '/var/www/alooshomal.ir' }}
          overwrite: true

      - name: Pull new images and restart services
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            set -e
            cd ${{ vars.DEPLOY_PATH || '/var/www/alooshomal.ir' }}

            # Pull from GHCR. Works without credentials if the packages are
            # public; otherwise set a GHCR_PAT secret with read:packages.
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # nginx reads its config once at start; the compose file is
            # bind-mounted (deploy/nginx), so a scp of new locations does NOT
            # make the running container pick them up ("up -d" sees no change
            # and leaves it running). Reload every deploy so config edits such
            # as /media/ actually take effect.
            if docker compose -f docker-compose.prod.yml ps --status running --services | grep -q '^nginx$'; then
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -t
              docker compose -f docker-compose.prod.yml exec -T nginx nginx -s reload
              echo "nginx config reloaded"
            fi

            # Drop dangling images from previous builds.
            docker image prune -f
