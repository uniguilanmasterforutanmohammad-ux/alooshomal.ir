# =============================================================================
#  alooshomal.ir — Nginx site config (runs inside the nginx container)
#
#  Upstreams use the docker-compose service names, so this config only works
#  inside the compose network. TLS is terminated by ArvanCloud at the edge, so
#  the origin container is reached over plain HTTP.
# =============================================================================

upstream alooshomal_web {
    server web:3000;
    keepalive 32;
}

upstream alooshomal_api {
    server api:4000;
    keepalive 32;
}

# Inherit the client scheme when Arvan forwards it, otherwise fall back to $scheme.
map $http_x_forwarded_proto $alooshomal_proto {
    default $scheme;
    http    http;
    https   https;
}

server {
    listen      80;
    listen      [::]:80;
    server_name alooshomal.ir www.alooshomal.ir;

    server_tokens off;

    # Allow avatar / cover-image uploads to reach the API.
    client_max_body_size 25m;

    access_log /var/log/nginx/alooshomal.access.log;
    error_log  /var/log/nginx/alooshomal.error.log;

    # ---- Next.js route handlers under /api/proxy/* are served by the web app --
    location ^~ /api/proxy/ {
        proxy_pass http://alooshomal_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # ---- NestJS API (everything else under /api) ------------------------------
    location /api/ {
        proxy_pass http://alooshomal_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---- Immutable Next.js build assets ---------------------------------------
    location /_next/static/ {
        proxy_pass http://alooshomal_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- Everything else -> Next.js web app -----------------------------------
    location / {
        proxy_pass http://alooshomal_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}

# ---- gzip (http context) -----------------------------------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/x-font-ttf
    font/woff2
    image/svg+xml;
