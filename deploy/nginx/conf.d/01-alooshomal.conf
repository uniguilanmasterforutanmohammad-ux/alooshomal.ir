# =============================================================================
#  alooshomal.ir — HTTP (port 80) server block.
#
#  Runs inside the nginx container. Shared http-context directives (upstreams,
#  the X-Forwarded-Proto map and gzip) live in 00-alooshomal-http.conf, and the
#  proxy locations are shared with the HTTPS block via alooshomal-locations.inc.
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    # Both public domains serve the same app; the certificate issued by
    # enable-ssl.sh carries all of these names (see DOMAINS in that script).
    server_name alooshomal.ir www.alooshomal.ir shomalicard.ir www.shomalicard.ir;

    include /etc/nginx/conf.d/alooshomal-locations.inc;
}
