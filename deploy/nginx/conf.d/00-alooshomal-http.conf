# =============================================================================
#  alooshomal.ir — http-context nginx settings (upstreams, map, gzip).
#  Loaded before the server blocks; see 01-alooshomal.conf / 02-alooshomal-ssl.conf
# =============================================================================

# Resolve service names at request time via Docker's embedded DNS, so nginx can
# start even when web/api are still booting (no startup-order dependency). The
# short cache TTL means that after a redeploy recreates a container with a new
# IP, nginx picks the fresh address within a couple of seconds instead of
# proxying to the dead one and returning 502.
resolver 127.0.0.11 valid=2s ipv6=off;

# Inherit the client scheme when Arvan forwards it, otherwise fall back to $scheme.
map $http_x_forwarded_proto $alooshomal_proto {
    default $scheme;
    http    http;
    https   https;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    application/x-font-ttf
    font/woff2
    image/svg+xml;
