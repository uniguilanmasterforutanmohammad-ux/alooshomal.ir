# =============================================================================
#  Nginx site config — alooshomal.ir behind ArvanCloud CDN
#
#  Instal on the server at:
#     /etc/nginx/sites-available/alooshomal.ir.conf
#  Enable:
#     ln -s /etc/nginx/sites-available/alooshomal.ir.conf /etc/nginx/sites-enabled/
#  Test & reload:
#     nginx -t && systemctl reload nginx
#
#  Routing model (see docker-compose.prod.yml):
#     web (Next.js) -> 127.0.0.1:3000
#     api (NestJS)  -> 127.0.0.1:4000   (all routes under /api)
#  ArvanCloud terminates TLS at its edge, so the origin is reached over HTTP.
# =============================================================================

# --- Real visitor IP behind ArvanCloud ---------------------------------------
# ArvanCloud proxies requests, so $remote_addr is an edge node, not the visitor.
# The real IP arrives in the "ar-real-ip" header.
# Source of ranges: https://www.arvancloud.ir/ips.txt  (refresh occasionally).
set_real_ip_from 185.143.232.0/22;
set_real_ip_from 188.229.116.16/30;
set_real_ip_from 94.101.182.0/27;
set_real_ip_from 2.144.3.128/28;
set_real_ip_from 37.32.16.0/27;
set_real_ip_from 37.32.17.0/27;
set_real_ip_from 37.32.18.0/27;
set_real_ip_from 37.32.19.0/27;
set_real_ip_from 185.215.232.0/22;
set_real_ip_from 178.131.120.48/28;
set_real_ip_from 94.101.183.0/28;
set_real_ip_from 78.157.36.112/28;
set_real_ip_from 95.38.61.80/28;
set_real_ip_from 193.24.119.0/29;
real_ip_header ar-real-ip;
real_ip_recursive on;

# Inherit the client scheme when Arvan forwards it, otherwise fall back to $scheme.
map $http_x_forwarded_proto $alooshomal_proto {
    default $scheme;
    http    http;
    https   https;
}

upstream alooshomal_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream alooshomal_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
#  HTTP server — serves the site to ArvanCloud's edge.
# -----------------------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name alooshomal.ir www.alooshomal.ir;

    # Let an ACME client (certbot) issue certs for the origin, if wanted.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Allow avatar / cover-image uploads to reach the API.
    client_max_body_size 25m;

    # Do not advertise the Nginx version.
    server_tokens off;

    access_log /var/log/nginx/alooshomal.access.log;
    error_log  /var/log/nginx/alooshomal.error.log;

    # ---- Next.js route handlers under /api/proxy/* are served by the web app --
    location ^~ /api/proxy/ {
        proxy_pass http://alooshomal_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
    }

    # ---- NestJS API (everything else under /api) ------------------------------
    location /api/ {
        proxy_pass http://alooshomal_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 60s;
    }

    # ---- Immutable Next.js build assets ---------------------------------------
    location /_next/static/ {
        proxy_pass http://alooshomal_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ---- Everything else -> Next.js web app -----------------------------------
    location / {
        proxy_pass http://alooshomal_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $alooshomal_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    # ---- gzip -----------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/x-font-ttf
        font/woff2
        image/svg+xml;
}

# =============================================================================
