name: alooshomal

services:
  db:
    image: postgres:17-alpine
    container_name: alooshomal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alooshomal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-alooshomal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alooshomal} -d ${POSTGRES_DB:-alooshomal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alooshomal

  redis:
    image: redis:7-alpine
    container_name: alooshomal-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alooshomal

  minio:
    # MinIO withdrew its official images in 2025, so the stack uses the
    # maintained community fork `pgsty/silo`. In production this is mirrored to
    # GHCR (see .github/workflows/deploy.yml); locally the upstream tag is
    # pulled directly. Both are drop-in replacements for minio/minio.
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-09-16T00-00-00Z}
    container_name: alooshomal-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alooshomal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_in_production}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alooshomal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: alooshomal-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://alooshomal:change_me_in_production@db:5432/alooshomal?schema=public}
      API_PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-please_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@alooshomal.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BACKUP_DIR: ${BACKUP_DIR:-/usr/src/app/backups}
      BACKUP_KEEP: ${BACKUP_KEEP:-20}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-alooshomal}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_in_production}
      MINIO_BUCKET: ${MINIO_BUCKET:-alooshomal}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - api_backups:/usr/src/app/backups
    networks:
      - alooshomal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: alooshomal-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      INTERNAL_API_URL: http://api:4000/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - alooshomal

volumes:
  db_data:
    name: alooshomal_db_data
  api_backups:
    name: alooshomal_api_backups
  minio_data:
    name: alooshomal_minio_data

networks:
  alooshomal:
    name: alooshomal_network
    driver: bridge
