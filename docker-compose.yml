name: alooshomal

services:
  db:
    image: postgres:17-alpine
    container_name: alooshomal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alooshomal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ${POSTGRES_DB:-alooshomal}
    ports:
      # Database and object-storage admin ports are for the local machine only;
      # never expose them on a public interface.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alooshomal} -d ${POSTGRES_DB:-alooshomal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alooshomal

  redis:
    image: redis:7-alpine
    container_name: alooshomal-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alooshomal

  minio:
    # MinIO withdrew its official images in 2025, so the stack uses the
    # maintained community fork `pgsty/silo`. In production this is mirrored to
    # GHCR (see .github/workflows/deploy.yml); locally the upstream tag is
    # pulled directly. Both are drop-in replacements for minio/minio.
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-09-16T00-00-00Z}
    container_name: alooshomal-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alooshomal}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_in_production}
    ports:
      # `MINIO_PORT` is the port inside the compose network (the S3 client uses
      # it), while `MINIO_HOST_PORT` is what the browser reaches on the host.
      # They must stay separate: a host-port conflict (e.g. port 9000 already
      # taken by another container) used to break object storage because both
      # were driven by the same variable.
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alooshomal

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: alooshomal-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://alooshomal:change_me_in_production@db:5432/alooshomal?schema=public}
      API_PORT: "4000"
      JWT_SECRET: ${JWT_SECRET:-please_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@alooshomal.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Public API origin, used by the dev payment simulator to send the
      # browser back to the API callback (local web has no /api proxy).
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      # Simulated checkout. Empty = auto (on for non-production + localhost).
      PAYMENT_SIMULATOR: ${PAYMENT_SIMULATOR:-}
      BACKUP_DIR: ${BACKUP_DIR:-/usr/src/app/backups}
      BACKUP_KEEP: ${BACKUP_KEEP:-20}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-alooshomal}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-change_me_in_production}
      MINIO_BUCKET: ${MINIO_BUCKET:-alooshomal}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:${MINIO_HOST_PORT:-9000}}
      # Melipayamak OTP endpoint path (embeds the sender line + token).
      # Production falls back to the project token; local dev uses the fixed
      # dev code (123456) unless this is set.
      MELIPAYAMAK_OTP_PATH: ${MELIPAYAMAK_OTP_PATH:-}
      # Shared-template endpoint for admin notification SMS. Production falls
      # back to the project token; bodyId=586239 is fixed in code.
      MELIPAYAMAK_SHARED_PATH: ${MELIPAYAMAK_SHARED_PATH:-}
      # Alternative to MELIPAYAMAK_OTP_PATH: Melipayamak REST credentials.
      # The API key is sent as the `password` parameter. Requires a sender
      # line (MELIPAYAMAK_OTP_FROM or MELIPAYAMAK_SMS_FROM).
      MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME:-}
      MELIPAYAMAK_API_KEY: ${MELIPAYAMAK_API_KEY:-}
      MELIPAYAMAK_OTP_FROM: ${MELIPAYAMAK_OTP_FROM:-}
      # Melipayamak simple-send path (includes the token) used by server
      # resource alerts; empty = those SMSes are skipped.
      MELIPAYAMAK_SMS_PATH: ${MELIPAYAMAK_SMS_PATH:-}
      # Sender line for simple-send (the `from` field in Melipayamak's body).
      MELIPAYAMAK_SMS_FROM: ${MELIPAYAMAK_SMS_FROM:-}
      # Optional fallback line for admin notification SMS. The admin-panel
      # value wins; when both are empty the oldest admin account's phone is used.
      SUPPORT_CHAT_ALERT_PHONE: ${SUPPORT_CHAT_ALERT_PHONE:-}
      # SMTP account used to deliver the same OTP by email. Leave empty to
      # keep the flow SMS-only; see MAIL_* in .env.example.
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-شمالی کارت}
      # Optional dedicated key for encrypting the brand social-account
      # passwords (admin «شبکه‌های اجتماعی»). Empty = derive from JWT_SECRET.
      SOCIAL_CREDENTIALS_KEY: ${SOCIAL_CREDENTIALS_KEY:-}
      # PayPing merchant token used by the «درگاه پرداخت» admin panel; the
      # token stays server-side (never shipped to the browser).
      PAYPING_TOKEN: ${PAYPING_TOKEN:-}
      PAYPING_BASE_URL: ${PAYPING_BASE_URL:-https://api.payping.ir}
      # PayPing OAuth application (authorization-code + PKCE) used by the
      # separate «درگاه پرداخت (OAuth)» panel.
      PAYPING_OAUTH_CLIENT_ID: ${PAYPING_OAUTH_CLIENT_ID:-}
      PAYPING_OAUTH_CLIENT_SECRET: ${PAYPING_OAUTH_CLIENT_SECRET:-}
      PAYPING_OAUTH_REDIRECT_URI: ${PAYPING_OAUTH_REDIRECT_URI:-https://shomalicard.ir}
      # Zohal inquiry services (identity, banking, bill, …). The bearer token
      # stays server-side; each service is switched on from the «زحل» panel.
      ZOHAL_TOKEN: ${ZOHAL_TOKEN:-}
      ZOHAL_BASE_URL: ${ZOHAL_BASE_URL:-https://service.zohal.io}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - api_backups:/usr/src/app/backups
    networks:
      - alooshomal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    container_name: alooshomal-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Browser-facing media origin; used by the web CSP `img-src`.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:${MINIO_HOST_PORT:-9000}}
      INTERNAL_API_URL: http://api:4000/api
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - alooshomal

volumes:
  db_data:
    name: alooshomal_db_data
  api_backups:
    name: alooshomal_api_backups
  minio_data:
    name: alooshomal_minio_data

networks:
  alooshomal:
    name: alooshomal_network
    driver: bridge
